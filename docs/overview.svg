<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="IBM Plex Sans, ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Same look as the README collage (docs/screenshot.jpg): dark green ground
       with a soft glow and a faint grid, dark device frames, light map screens,
       yellow accent for the data flow. The map server is shown as the logo
       (public/icon.svg). -->
  <defs>
    <radialGradient id="glow" cx="60%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2a3a31"/>
      <stop offset=".7" stop-color="#18201c"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 V40 M0 40 H40" fill="none" stroke="#b9c3b5" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/>
    </marker>
    <clipPath id="frame"><rect width="960" height="380" rx="14"/></clipPath>
    <clipPath id="logo"><rect width="74" height="74" rx="15"/></clipPath>
    <!-- Mini map as on the device screens: bullseye rings and own aircraft -->
    <symbol id="minimap" viewBox="0 0 60 60">
      <rect width="60" height="60" fill="#dfe5dc"/>
      <path d="M20 0 V60 M40 0 V60 M0 20 H60 M0 40 H60" stroke="#b9c3b5" stroke-width="1"/>
      <circle cx="30" cy="30" r="7" fill="none" stroke="#2c3a33" stroke-width="1.6"/>
      <circle cx="30" cy="30" r="16" fill="none" stroke="#2c3a33" stroke-width="1.3"/>
      <g transform="translate(41 19) rotate(45)">
        <path d="M0 -5 L4.5 4.5 L0 2.2 L-4.5 4.5 Z" fill="#1f5fbf"/>
      </g>
    </symbol>
    <!-- The full logo, 120 x 120 -->
    <symbol id="mark" viewBox="0 0 120 120">
      <rect width="120" height="120" fill="#dfe5dc"/>
      <path d="M40 0 V120 M80 0 V120 M0 40 H120 M0 80 H120" stroke="#b9c3b5" stroke-width="1.5"/>
      <circle cx="60" cy="60" r="14" fill="none" stroke="#2c3a33" stroke-width="2.5"/>
      <circle cx="60" cy="60" r="30" fill="none" stroke="#2c3a33" stroke-width="2"/>
      <circle cx="60" cy="60" r="46" fill="none" stroke="#2c3a33" stroke-width="1.5" opacity=".5"/>
      <path d="M60 8 V112 M8 60 H112" stroke="#2c3a33" stroke-width="1.5" opacity=".5"/>
      <g transform="translate(80 40) rotate(45)">
        <line x1="0" y1="-8" x2="0" y2="-26" stroke="#1f5fbf" stroke-width="3" stroke-linecap="round"/>
        <path d="M0 -9 L8 8 L0 4 L-8 8 Z" fill="#1f5fbf"/>
      </g>
    </symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="380" fill="#18201c"/>
    <rect width="960" height="380" fill="url(#glow)"/>
    <rect width="960" height="380" fill="url(#grid)"/>
  </g>

  <!-- Groups the DCS PC and the map server: both run on the same machine. -->
  <rect x="18" y="92" width="554" height="236" rx="16" fill="none" stroke="#a9b8ae" stroke-width="1.5" stroke-dasharray="6 5" opacity=".5"/>
  <circle cx="192" cy="75" r="4" fill="#ffd166"/>
  <text x="204" y="80" fill="#e3e9e4" font-size="13" font-weight="600">One PC -- the one running DCS</text>

  <!-- Step 1: the DCS PC -->
  <g>
    <rect x="30" y="110" width="230" height="200" rx="12" fill="#1f2a24" stroke="#3a4148" stroke-width="1.5"/>
    <text x="145" y="138" text-anchor="middle" fill="#eef3f6" font-size="15" font-weight="600">Your DCS PC</text>

    <!-- monitor with the flight on it: sky, ground and own aircraft -->
    <rect x="85" y="155" width="120" height="78" rx="5" fill="#15191d" stroke="#3a4148" stroke-width="1.5"/>
    <rect x="94" y="163" width="102" height="60" rx="2" fill="#cfdbe6"/>
    <path d="M94 204 H196 V221 a2 2 0 0 1 -2 2 H96 a2 2 0 0 1 -2 -2 Z" fill="#b9c3b5"/>
    <path d="M130 234 h40 M145 234 v9 h10 v-9" stroke="#3a4148" stroke-width="2.5" fill="none"/>
    <path d="M145 178 l9 22 l-9 -5 l-9 5 z" fill="#1f5fbf"/>

    <text x="145" y="262" text-anchor="middle" fill="#a9b8ae" font-size="12">a small add-on (the "hook")</text>
    <text x="145" y="280" text-anchor="middle" fill="#a9b8ae" font-size="12">reads your aircraft and</text>
    <text x="145" y="298" text-anchor="middle" fill="#a9b8ae" font-size="12">everything around it</text>
  </g>

  <line x1="268" y1="210" x2="322" y2="210" stroke="#ffd166" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: the map server, shown as the logo -->
  <g>
    <rect x="330" y="110" width="230" height="200" rx="12" fill="#1f2a24" stroke="#3a4148" stroke-width="1.5"/>
    <text x="445" y="138" text-anchor="middle" fill="#eef3f6" font-size="15" font-weight="600">Map Server</text>

    <g transform="translate(408 156)" clip-path="url(#logo)">
      <use href="#mark" width="74" height="74"/>
    </g>

    <text x="445" y="252" text-anchor="middle" fill="#a9b8ae" font-size="12">turns that into a live map</text>
    <text x="445" y="270" text-anchor="middle" fill="#a9b8ae" font-size="12">and serves it over your</text>
    <text x="445" y="288" text-anchor="middle" fill="#a9b8ae" font-size="12">own Wi-Fi -- nothing leaves it</text>
  </g>

  <line x1="568" y1="210" x2="622" y2="210" stroke="#ffd166" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- wifi glyph on the arrow -->
  <g transform="translate(583,183)" stroke="#ffd166" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M2 10 a14 14 0 0 1 20 0"/>
    <path d="M6.5 14.5 a8 8 0 0 1 11 0"/>
    <circle cx="12" cy="19" r="1.6" fill="#ffd166" stroke="none"/>
  </g>

  <!-- Step 3: any device, each showing the map -->
  <g>
    <rect x="630" y="110" width="300" height="200" rx="12" fill="#1f2a24" stroke="#3a4148" stroke-width="1.5"/>
    <text x="780" y="138" text-anchor="middle" fill="#eef3f6" font-size="15" font-weight="600">Any screen in the house</text>

    <!-- tablet -->
    <g transform="translate(662,158)">
      <rect x="0" y="0" width="70" height="92" rx="9" fill="#15191d" stroke="#3a4148" stroke-width="1.2"/>
      <svg x="6" y="7" width="58" height="78" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><use href="#minimap" width="60" height="60"/></svg>
    </g>
    <!-- phone -->
    <g transform="translate(748,178)">
      <rect x="0" y="0" width="34" height="62" rx="7" fill="#15191d" stroke="#3a4148" stroke-width="1.2"/>
      <svg x="3.5" y="4" width="27" height="54" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><use href="#minimap" width="60" height="60"/></svg>
    </g>
    <!-- laptop -->
    <g transform="translate(796,190)">
      <rect x="10" y="0" width="76" height="48" rx="4" fill="#15191d" stroke="#3a4148" stroke-width="1.2"/>
      <svg x="15" y="5" width="66" height="38" viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><use href="#minimap" width="60" height="60"/></svg>
      <path d="M0 50 h96 l-8 10 h-80 z" fill="#15191d" stroke="#3a4148" stroke-width="1.2"/>
    </g>

    <text x="780" y="268" text-anchor="middle" fill="#a9b8ae" font-size="12">tablet, phone, laptop --</text>
    <text x="780" y="284" text-anchor="middle" fill="#a9b8ae" font-size="12">just open a web address,</text>
    <text x="780" y="300" text-anchor="middle" fill="#a9b8ae" font-size="12">nothing to install</text>
  </g>
</svg>
